name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Fetch offline OCR engine
        continue-on-error: true
        run: |
          mkdir -p /tmp/ocrdl && cd /tmp/ocrdl && npm init -y >/dev/null
          npm install tesseract.js@5.1.1 tesseract.js-core@5.1.1 @tesseract.js-data/ara @tesseract.js-data/eng
          cd "$GITHUB_WORKSPACE"
          mkdir -p www/ocr/lang
          cp /tmp/ocrdl/node_modules/tesseract.js/dist/tesseract.min.js /tmp/ocrdl/node_modules/tesseract.js/dist/worker.min.js www/ocr/
          cp /tmp/ocrdl/node_modules/tesseract.js-core/tesseract-core*lstm* www/ocr/
          for L in ara eng; do
            P=$(find /tmp/ocrdl/node_modules/@tesseract.js-data/$L -name "$L.traineddata.gz" | grep best_int | head -1)
            [ -z "$P" ] && P=$(find /tmp/ocrdl/node_modules/@tesseract.js-data/$L -name "$L.traineddata.gz" | head -1)
            cp "$P" www/ocr/lang/
          done
          ls -la www/ocr www/ocr/lang
      - name: Install Capacitor
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Allow camera (barcode scanner)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA\|uses-feature" android/app/src/main/AndroidManifest.xml
      - name: Set version from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Use Dukkani icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            rm -f $RES/mipmap-$n/ic_launcher_foreground.png
          done
      - name: Sync web files
        run: npx cap sync android
      - name: Use permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/signing.bin
            rm -f ~/.android/debug.keystore
            keytool -importkeystore -srckeystore /tmp/signing.bin -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -destkeypass android -srcalias androiddebugkey -destalias androiddebugkey -noprompt
            echo "Using the permanent signing key"
          else
            echo "WARNING: no KEYSTORE_B64 secret, a random key will be used and updates will not install over older builds"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E "SHA256|Owner" || true
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dukkani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
