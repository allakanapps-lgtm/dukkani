<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1d4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>دكّاني</title>
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout concept: one phone-width column, navy hero on Home, quiet white cards elsewhere, raised "+" in the bottom bar. */
:root {
  --bg: #F3F6FC;
  --surface: #FFFFFF;
  --surface2: #EBF0FA;
  --ink: #0D1B3E;
  --muted: #55627F;
  --line: #D9E1F0;
  --brand: #2150E0;
  --brand-ink: #FFFFFF;
  --brand-soft: #E1EAFF;
  --good: #0F7A55;
  --good-soft: #D9F3E8;
  --warn: #9A5A06;
  --warn-soft: #FFEFD0;
  --bad: #B8322A;
  --bad-soft: #FCE3E0;
  --hero-a: #0A1A3F;
  --hero-b: #16357A;
  --hero-ink: #FFFFFF;
  --hero-mute: #B7C5EA;
  --scrim: rgba(8, 16, 38, .5);
  --shadow: 0 8px 24px rgba(13, 27, 62, .10);
  --font: system-ui, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080F22; --surface: #101A33; --surface2: #18264A; --ink: #E8EEFF; --muted: #9DABCF; --line: #24345E;
    --brand: #6B96FF; --brand-ink: #07112B; --brand-soft: #1B2D60;
    --good: #4BDC9D; --good-soft: #0E3A2C; --warn: #F2B258; --warn-soft: #43300F; --bad: #FF8A80; --bad-soft: #4A1D1A;
    --hero-a: #0B1A42; --hero-b: #1B3C8C; --scrim: rgba(0, 0, 0, .62); --shadow: 0 8px 24px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080F22; --surface: #101A33; --surface2: #18264A; --ink: #E8EEFF; --muted: #9DABCF; --line: #24345E;
  --brand: #6B96FF; --brand-ink: #07112B; --brand-soft: #1B2D60;
  --good: #4BDC9D; --good-soft: #0E3A2C; --warn: #F2B258; --warn-soft: #43300F; --bad: #FF8A80; --bad-soft: #4A1D1A;
  --hero-a: #0B1A42; --hero-b: #1B3C8C; --scrim: rgba(0, 0, 0, .62); --shadow: 0 8px 24px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
bdi { unicode-bidi: isolate; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 28px; height: 28px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

#app { max-width: 520px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 110px; min-height: 100vh; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 17px; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gap { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 6px; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding-block: 8px 12px; min-height: 56px; }
.top h1 { flex: 1; min-width: 0; font-size: 20px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn.plain { border-color: transparent; background: transparent; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; background: none; border: 0; text-align: start; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--surface2); }
.avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; font-weight: 700; }
.avatar.good { background: var(--good-soft); color: var(--good); }
.avatar.warn { background: var(--warn-soft); color: var(--warn); }
.avatar.bad { background: var(--bad-soft); color: var(--bad); }
.avatar.mute { background: var(--surface2); color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--brand-soft); color: var(--brand); }

/* buttons */
.btn { min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .5; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 140px; }

/* tabs */
.seg { display: flex; gap: 4px; background: var(--surface2); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 10px; font-weight: 600; color: var(--muted); padding-inline: 8px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.chip { flex: none; min-height: 38px; padding: 4px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; color: var(--muted); }
.chip.on { background: var(--brand-soft); color: var(--brand); border-color: transparent; font-weight: 700; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.in, select.in, textarea.in { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
textarea.in { min-height: 110px; resize: vertical; }
.in::placeholder { color: var(--muted); opacity: .8; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formerr { color: var(--bad); font-size: 13px; min-height: 0; }
.formerr:empty { display: none; }
.search { position: relative; }
.search .ic { position: absolute; inset-inline-start: 14px; top: 13px; color: var(--muted); }
.search .in { padding-inline-start: 44px; }

/* hero */
.hero { background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border-radius: 24px; padding: 20px 18px 18px; }
.hero h1 { color: var(--hero-ink); }
.hero .sub { color: var(--hero-mute); }
.ask { display: flex; gap: 8px; margin-top: 16px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); border-radius: 16px; padding: 6px; }
.ask input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; padding: 8px 10px; font-size: 16px; }
.ask input::placeholder { color: var(--hero-mute); }
.ask input:focus-visible { outline: none; }
.ask:focus-within { border-color: #fff; }
.ask button { width: 46px; border: 0; border-radius: 12px; background: #fff; color: #0A1A3F; display: grid; place-items: center; flex: none; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(255, 255, 255, .16); color: var(--hero-ink); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-align: start; display: flex; flex-direction: column; gap: 10px; min-height: 108px; }
.tile:active { background: var(--surface2); }
.tile b { font-size: 16px; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.banner.info { background: var(--brand-soft); color: var(--brand); }
.banner .btn { margin-top: 6px; }

/* bottom nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding-inline: 8px; }
.nav button { background: none; border: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 500; position: relative; }
.nav button.on { color: var(--brand); font-weight: 700; }
.nav .plus { width: 56px; height: 56px; min-height: 56px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); margin: -18px auto 4px; box-shadow: var(--shadow); }
.dot { position: absolute; top: 8px; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding-inline: 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 41; max-width: 520px; margin-inline: auto; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 90vh; overflow-y: auto; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); animation: up .22s ease-out; }
.sheet h2 { margin-bottom: 14px; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: -6px auto 14px; }
#toast { position: fixed; inset-inline: 16px; bottom: 96px; z-index: 60; max-width: 420px; margin-inline: auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; text-align: center; font-weight: 600; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: none; }
#toast.has-act { pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 14px; }
.toastbtn { background: transparent; border: 1px solid currentColor; color: inherit; font: inherit; font-weight: 700; border-radius: 10px; min-height: 36px; padding: 0 14px; cursor: pointer; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* wizard */
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-weight: 600; text-align: start; }
.opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.opt .ic { color: var(--muted); }
.opt.on .ic { color: var(--brand); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; opacity: 0; animation: appear .35s ease-out forwards; }
.steps .tick { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--good-soft); color: var(--good); flex: none; margin-top: 1px; }
.steps .tick.warn { background: var(--warn-soft); color: var(--warn); }
.msg { white-space: pre-wrap; background: var(--surface2); border-radius: 14px; padding: 14px; font-size: 15px; line-height: 1.8; user-select: text; }
.plan { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; }
.plan .ic { color: var(--good); margin-top: 3px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .h { font-size: 12px; color: var(--muted); padding-block: 4px; }
.cal button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; font-weight: 500; position: relative; }
.cal button.today { color: var(--brand); font-weight: 700; }
.cal button.sel { background: var(--brand); color: var(--brand-ink); }
.cal button.has::after { content: ""; position: absolute; bottom: 5px; inset-inline: 0; margin-inline: auto; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.cal button.off { visibility: hidden; }

/* report */
.kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kpi { background: var(--surface2); border-radius: 14px; padding: 10px; }
.kpi b { display: block; font-size: 15px; word-break: break-word; }
.bars svg { width: 100%; height: auto; display: block; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 36px; height: 36px; opacity: .6; }
.welcome { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 24px; }
.logo { width: 76px; height: 76px; border-radius: 22px; background: linear-gradient(150deg, var(--hero-b), var(--brand)); color: #fff; display: grid; place-items: center; }

@media (max-width: 380px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .steps li { animation: none; opacity: 1; }
  .sheet { animation: none; }
  #toast { transition: none; }
}

/* ===== bilingual / direction ===== */
.langbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; }
.hero .langbtn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); color: #fff; }
.mirror { transform: scaleX(-1); }
html[dir=ltr] .i-back, html[dir=ltr] .i-chev { transform: scaleX(-1); }
html[dir=ltr] .nav .dot { inset-inline-start: calc(50% + 6px); }

/* photos */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs:empty { display: none; }
.thumb { width: 72px; height: 72px; padding: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); display: grid; place-items: center; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .94); display: flex; flex-direction: column; color: #fff; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
.pv-bar .iconbtn { color: #fff; border-color: rgba(255, 255, 255, .3); background: transparent; }
.pv-body { flex: 1; display: grid; place-items: center; padding: 8px; min-height: 0; }
.pv-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.pin { text-align: center; font-size: 24px; letter-spacing: .4em; }

/* ===== dukkani additions ===== */
.hero .kpi.dark { background: rgba(255,255,255,.12); }
.hero .kpi.dark .small { color: var(--hero-mute); }
.hero .kpi.dark b { color: #fff; }
.hero h1.num { color: #fff; }
.good { color: var(--good); }
.big { font-size: 22px; display: block; }
.block { display: block; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; cursor: pointer; text-align: start; }
.cartrow { flex-wrap: wrap; gap: 8px 12px; }
.cartrow .grow { min-width: 60%; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty .iconbtn.sm { width: 38px; height: 38px; border-radius: 12px; }
.qin { width: 64px; min-height: 40px; padding: 4px 6px; text-align: center; }
.linet { margin-inline-start: auto; }
.cartbar { position: fixed; inset-inline: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 19; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(13,27,62,.08); }
.cartbar.hide { display: none; }
.cartbar-in { max-width: 520px; margin-inline: auto; display: flex; align-items: center; gap: 12px; }
body:has(.cartbar:not(.hide)) #app { padding-bottom: 190px; }
.thumb { position: relative; }
.thumb .x { position: absolute; top: -6px; inset-inline-end: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--bad); color: #fff; font-size: 14px; line-height: 1; display: grid; place-items: center; padding: 0; }
.st { color: #fff !important; font-weight: 700; }
.st-p { background: var(--good) !important; } .st-a { background: var(--bad) !important; } .st-h { background: #E8A33D !important; } .st-l { background: var(--brand) !important; } .st-t { background: #B7791F !important; }
.legend i.lg-p { background: var(--good); } .legend i.lg-a { background: var(--bad); } .legend i.lg-h { background: #E8A33D; } .legend i.lg-l { background: var(--brand); } .legend i.lg-t { background: #B7791F; }
.cal button { color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pg { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.pg img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
.pg.done { border-color: var(--good); }
.nbimg { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); }
.nbimg img { display: block; max-width: none; }
/* scanner */
#scan-root { position: relative; z-index: 90; }
.scan { position: fixed; inset: 0; background: #000; z-index: 90; display: flex; flex-direction: column; color: #fff; }
.scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-guide { position: absolute; inset-inline: 8%; top: 28%; height: 24%; border: 3px solid rgba(255,255,255,.9); border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); pointer-events: none; }
.scan-bar { position: relative; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; background: linear-gradient(#000a, transparent); }
.scan-bar .iconbtn { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(0,0,0,.35); }
.scan-low { position: absolute; inset-inline: 0; bottom: 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, #000d 35%); display: flex; flex-direction: column; gap: 8px; }
.scan-low .in { background: #fff; color: #111; }
.scan-low .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
.scan-low .btn.primary { background: var(--brand); border-color: var(--brand); }
.scan-msg { min-height: 28px; text-align: center; font-weight: 700; font-size: 16px; background: rgba(0,0,0,.55); border-radius: 12px; padding: 6px 10px; }
.scan-msg:empty { display: none; } .scan-msg.bad { background: #8a1c14; }
#photo-root .pv { z-index: 100; }
@media print { body > *:not(#print-root) { display: none !important; } }
.nav button.plus.on, .nav button.plus:active { color: var(--brand-ink); background: var(--brand); }

</style>
</head>
<body>
<div id="root"><div id="app"></div></div>
<div id="sheet-root"></div>
<div id="scan-root"></div>
<div id="photo-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

}
function pfCalc() {
  const el = document.getElementById('pf-calc'); if (!el) return; const cur = val('pf-cur') || 'SYP'; const rate = curRate(); const out = [];
  const { unit, w, b, pack, pu, F } = pfFactors(); const pr = num('pf-price'), co = num('pf-cost');
  const show = (id, on) => { const x = document.getElementById(id); if (x) x.style.display = on ? '' : 'none'; };
  show('pf-pk', !w); show('pf-pk2', !w && (b > 1 || pack > 1) && pu === 'p'); show('pf-pk3', !w && (b > 0 || pack > 0));

  if (pl1) pl1.textContent = 'سعر بيع ' + un; if (pl2) pl2.textContent = 'تكلفة ' + un;
  const m = (v) => (cur === 'USD' ? fmtU(v) : fmtS(Math.round(v)));
  if (F > 0 && pr > 0) {
    const pp = pr / F; const cc = co / F;
    if (F > 1) out.push(`القطعة: بيع ${m(pp)}${co > 0 ? ' · تكلفة ' + m(cc) : ''}`);
    if (!w) { const ub = pu === 'b' ? pr : num('pf-pbox') || (b > 1 ? pp * b : 0); const uc = pu === 'c' ? pr : num('pf-pctn') || (pack > 1 ? pp * pack : 0); if (b > 1 && pu !== 'b') out.push('العلبة: ' + m(ub)); if (pack > 1 && pu !== 'c') out.push('الطرد: ' + m(uc)); }
    if (cur === 'USD') out.push(rate ? `القطعة اليوم: ${fmtS(roundStep(pp * rate))}` : 'أدخل سعر الصرف ليظهر السعر بالليرة');
    if (co > 0) { const mg = Math.round((pr - co) / pr * 100); out.push(`هامش الربح ${mg}%${mg < 0 ? ' — خسارة!' : ''}`); }
  } else if (pu !== 'p' && F <= 1) out.push('اكتب عدد القطع في العلبة/الطرد أولاً.');

}

const UWORDS = 'كغ|كيلو|كج|kg|غرام|جرام|غ|g|ل\\.?\\s?س|ليرة|ليره|علبة|علبه|طرد|كرتونة|كرتون|كرتونه';
const normU = (u) => { u = nrm(u).replace(/\s|\./g, ''); if (/^(كغ|كيلو|كج|kg)$/.test(u)) return 'kg'; if (/^(غرام|جرام|غ|g)$/.test(u)) return 'g'; if (/^(لس|ليره)$/.test(u)) return 'm'; if (/^(علبه)$/.test(u)) return 'b'; if (/^(طرد|كرتونه|كرتون)$/.test(u)) return 'c'; return ''; };
function bestProduct(name) {
  const n = nrm(name); if (!n) return null; const ex = S.products.find((p) => nrm(p.name) === n); if (ex) return ex;
  const r = searchProducts(name); if (r.length) return r[0];
  const words = n.split(/\s+/).filter((w) => w.length > 1); if (words.length > 1) for (const w of words) { const q = searchProducts(w); if (q.length === 1) return q[0]; } return null;
}
function parseQuick(text) {

  return t.split(/[\n,;؛]+/).map((s) => s.trim()).filter(Boolean).map((raw) => {
    const U = `(?:(${UWORDS})(?=\\s|$))?`; let num = 0, unit = '', name = '';
    let m = raw.match(new RegExp(`^(\\d+(?:\\.\\d+)?)\\s*${U}\\s*(?:من\\s+)?(.*)$`, 'i'));
    if (m) { num = +m[1]; unit = normU(m[2] || ''); name = (m[3] || '').trim(); } else { m = raw.match(new RegExp(`^(.*?)\\s+(\\d+(?:\\.\\d+)?)\\s*${U}$`, 'i')); if (m) { name = m[1].trim(); num = +m[2]; unit = normU(m[3] || ''); } }
    if (!m || !name || !(num > 0)) return { raw, err: 'سطر غير مفهوم — اكتب: المبلغ أو الكمية ثم اسم الصنف' };
    const money = unit === 'm' || (!unit && num >= 100); const p = bestProduct(name);
    if (!p) return money ? { raw, free: true, name, qty: 1, price: num, total: num } : { raw, err: 'صنف غير موجود: ' + name };
    if (!canPrice(p)) return { raw, err: 'أدخل سعر الصرف أولاً' };

    if (unit === 'b' || unit === 'c') { const u = unitsOf(p).find((x) => x.k === unit); if (!u) return { raw, err: p.name + ' ليس له ' + (unit === 'b' ? 'علبة' : 'طرد') }; uk = unit; }
    else if (unit === 'g') qty = p.unit === 'غ' ? num : num / 1000;
    const u = unitOfItem(p, uk); const pr = sellU(p, u);
    if (!(pr > 0)) return { raw, err: 'حدّد سعر «' + p.name + '» أولاً' };
    if (money) { qty = qtyForAmount(num, pr); if (!isWeighed(p) && Math.abs(qty - Math.round(qty)) > 0.001) warn = 'الكمية كسر (' + fmtQ(qty) + ') — هل تقصد عدداً؟'; }
    return { raw, p, uk, qty, price: pr, total: money ? num : Math.round(qty * pr), warn, ul: u.l };
  });
}

/* ================= bulk price update from pasted WhatsApp price lists ================= */
const EMO = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200E}\u{200F}•●▪▫■◆⭐✅]/gu;
function parsePriceLine(raw) {
  let t = normDigits(raw).replace(EMO, ' ').replace(/(\d),(?=\d{3}(?!\d))/g, '$1').trim(); if (!t) return null;
  const bcm = t.match(/\b\d{8,14}\b/); let bc = ''; if (bcm) { bc = bcm[0]; t = t.replace(bc, ' '); }
  const re = /(\d+(?:\.\d+)?)\s*(\$|دولار|USD|usd|ل\.?\s?س|ليرة|ليره|SYP|كغ|كيلو|كج|kg|KG|غرام|جرام|غ|g|ml|مل|لتر|ل|L|l|متر|حبة|حبه|قطعة|قطعه)?(?![\p{L}\d])/gu;
  const found = []; let m; while ((m = re.exec(t))) found.push({ i: m.index, end: re.lastIndex, n: +m[1], u: m[2] || '' });
  const SIZE = /^(كغ|كيلو|كج|kg|KG|غرام|جرام|غ|g|ml|مل|لتر|ل|L|l|متر|حبة|حبه|قطعة|قطعه)$/;
  let pick = null; for (let k = found.length - 1; k >= 0; k--) { if (!SIZE.test(found[k].u)) { pick = found[k]; break; } }
  if (!pick) return { raw, err: 'لم أجد سعراً في السطر' };
  let cur = ''; if (/\$|دولار|usd/i.test(pick.u)) cur = 'USD'; else if (/ل\.?\s?س|ليرة|ليره|syp/i.test(pick.u)) cur = 'SYP'; else if (/\$|دولار/.test(t.slice(pick.end, pick.end + 3)) ) cur = 'USD';
  const name = (t.slice(0, pick.i) + ' ' + t.slice(pick.end)).replace(/[:=\-–—_.…،؛|>]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!name && !bc) return { raw, err: 'لا يوجد اسم' };
  return { raw, name, price: pick.n, cur, bc };
}
function matchScore(pn, ln) {
  if (!pn || !ln) return 0; if (pn === ln) return 4; if (ln.includes(pn) || pn.includes(ln)) return 3;
  const a = pn.split(/\s+/).filter((w) => w.length > 1), b = new Set(ln.split(/\s+/).filter((w) => w.length > 1)); if (!a.length) return 0;
  const hit = a.filter((w) => b.has(w)).length; const r = hit / a.length; return r >= 0.99 ? 2 : r >= 0.66 ? 1 : 0;
}
function priceRows() {
  const per = val('pr-per') || 'p', tgt = val('pr-tgt') || 'both', dc = val('pr-cur') || 'auto', keep = chk('pr-keep'); const rate = curRate();
  return val('pr-text').split(/\n+/).map((l) => l.trim()).filter(Boolean).map(parsePriceLine).filter(Boolean).map((r) => {
    if (r.err) return r; let p = null; if (r.bc) p = findBarcode(r.bc);
    if (!p) { const ln = nrm(r.name); let best = 0; for (const x of S.products) { const s = matchScore(nrm(x.name), ln); if (s > best) { best = s; p = x; } } if (best < 1) p = null; }
    let cur = r.cur || (dc !== 'auto' ? dc : r.price < 500 ? 'USD' : 'SYP');
    if (!p) return Object.assign(r, { cur, nomatch: true });
    const u = per === 'p' ? { f: 1 } : unitsOf(p).find((x) => x.k === per); if (!u) return Object.assign(r, { p, cur, err: 'هذا الصنف ليس له ' + (per === 'b' ? 'علبة' : 'طرد') + ' — حدّد التعبئة أولاً' });
    let v = r.price / u.f; if (cur !== p.cur) { if (!(rate > 0)) return Object.assign(r, { p, cur, err: 'أدخل سعر الصرف أولاً' }); v = cur === 'USD' ? v * rate : v / rate; }
    const rd = (x) => Math.round(x * (p.cur === 'USD' ? 1e6 : 100)) / (p.cur === 'USD' ? 1e6 : 100); v = rd(v);
    const o = { p, cur, upd: {} }; Object.assign(r, o);
    if (tgt === 'cost' || tgt === 'both') { r.upd.cost = v; if (tgt === 'cost' && keep && p.cost > 0 && p.price > 0) r.upd.price = rd(v * p.price / p.cost); }

}

  return `${top('الزبائن', { back: false, right: `<button class="iconbtn" data-act="custNew" aria-label="زبون جديد" style="background:var(--brand);color:var(--brand-ink);border-color:var(--brand)">${ic('plus')}</button>` })}
  <div class="stack"><div class="card"><div class="between"><span class="muted">إجمالي الديون على الزبائن</span><b class="num" style="color:var(--bad)">${fmtBal(td)}</b></div></div>
  <div class="btnrow"><button class="btn primary" data-act="debtSheet" data-id="">${ic('book', 'sm')} تسجيل دين (قديم أو جديد)</button><button class="btn" data-act="payPick">${ic('wallet', 'sm')} تسديد دفعة</button></div>
  ${dc ? `<button class="banner" style="border:0;text-align:start;width:100%" data-act="go" data-v="collect">${ic('bell', 'sm')}<span><b>${dc} زبون بحاجة لمتابعة تحصيل</b><br>اضغط لعرض قائمة التحصيل الأسبوعي</span></button>` : ''}
  <div class="search">${ic('search')}<input class="in" data-input="clist" placeholder="بحث بالاسم أو الرقم" value="${esc(V.p.q || '')}" autocomplete="off"></div>
  <div class="chips">${[['all', 'الكل'], ['debt', 'عليهم دين']].map(([k, t]) => `<button class="chip ${(V.p.f || 'all') === k ? 'on' : ''}" data-act="cfilter" data-k="${k}">${t}</button>`).join('')}</div>
  <div id="clist">${clistHtml()}</div></div>`;
};
VIEWS.customerDetail = (p) => {
  const c = by('customers', p.id); if (!c) return top('الزبون') + empty('users', 'غير موجود');
  const b = balanceOf(c.id); const L = customerLedger(c.id).slice().reverse();
  return `${top(c.name, { right: `<button class="iconbtn" data-act="custEdit" data-id="${c.id}" aria-label="تعديل">${ic('edit')}</button>` })}
  <div class="stack"><div class="hero"><span class="sub small">الرصيد المستحق عليه</span><h1 class="num" style="font-size:28px">${bal0(b) ? '0' : fmtBal(b)}</h1>${c.phone ? `<span class="sub small" dir="ltr">${esc(c.phone)}</span>` : ''}${c.note ? `<p class="sub small">${esc(c.note)}</p>` : ''}</div>
  <div class="btnrow"><button class="btn good" data-act="paySheet" data-id="${c.id}">${ic('wallet', 'sm')} تسجيل دفعة</button><button class="btn" data-act="debtSheet" data-id="${c.id}">${ic('book', 'sm')} تسجيل دين</button></div>
  <div class="btnrow"><button class="btn" data-act="stmt" data-id="${c.id}">${ic('send', 'sm')} كشف حساب</button>${c.phone ? `<button class="btn" data-act="remind" data-id="${c.id}">${ic('bell', 'sm')} تذكير بالدفع</button>` : ''}</div>
  ${purchasesBlock(c.id)}
  <div class="sec">سجل الحساب (الديون والدفعات)</div>
  ${L.length ? `<div class="card flush">${L.map((e) => ledgerRow(e)).join('')}</div>` : empty('book', 'لا حركات على هذا الحساب')}</div>`;
};
const MLAB = { cash: 'نقداً', sham: 'شام كاش', writeoff: 'إسقاط دين' };
function ledgerRow(e) {
  const isD = e.type === 'debt';
  const sub = isD ? (e.note || 'دين') : `${MLAB[e.method] || 'دفعة'}${e.method === 'sham' && e.payer ? ' من ' + e.payer : ''}${e.ref ? ' · مرجع ' + e.ref : ''}${e.note ? ' · ' + e.note : ''}`;
  return `<button class="row" data-act="ledgerOpen" data-id="${e.id}"><span class="avatar ${isD ? 'bad' : 'good'}">${ic(isD ? 'plus' : 'check')}</span><span class="grow"><b style="display:block">${isD ? 'دين' : 'دفعة'} ${e.old ? pill('info', 'قديم') : ''}</b><span class="small muted trunc" style="display:block">${fmtDate(e.date)} · ${esc(sub)}${e.recv ? ' · المستلم: ' + esc(e.recv) : ''}${(e.photos || []).length ? ' · 📷' + e.photos.length : ''}</span></span><b class="num" style="color:${isD ? 'var(--bad)' : 'var(--good)'}">${isD ? '+' : '−'}${money(e.amt, e.cur)}</b></button>`;
}
VIEWS.collect = () => {
  const dd = dueDebts();
  return `${top('التحصيل الأسبوعي')}<div class="stack"><p class="small muted">زبائن عليهم دين ولم يدفعوا ولم تذكّرهم منذ أسبوع أو أكثر. بعد التذكير اضغط «تم التذكير» ليخرج من القائمة 7 أيام.</p>
  ${dd.length ? dd.map(({ c, b, days }) => `<div class="card stack-s"><div class="between"><b>${esc(c.name)}</b><b class="num" style="color:var(--bad)">${fmtBal(b)}</b></div><span class="small muted">منذ ${days} يوم دون حركة${c.phone ? '' : ' · لا يوجد رقم'}</span>
  <div class="btnrow">${c.phone ? `<button class="btn sm" data-act="remind" data-id="${c.id}">${ic('send', 'sm')} واتساب</button>` : ''}<button class="btn sm good" data-act="paySheet" data-id="${c.id}">دفعة</button><button class="btn sm" data-act="reminded" data-id="${c.id}">تم التذكير</button></div></div>`).join('') : empty('check', 'لا يوجد أحد بحاجة لمتابعة الآن 👌')}</div>`;
};
function stmtText(c) {
  const L = customerLedger(c.id); const b = balanceOf(c.id);
  return `كشف حساب — ${shopName()}\nالسيد/ة ${c.name}\n` + L.map((e) => `${e.date} | ${e.type === 'debt' ? 'دين' : 'دفعة'} | ${e.type === 'debt' ? '+' : '-'}${money(e.amt, e.cur)}${e.note ? ' | ' + e.note : ''}`).join('\n') + `\n————\nالرصيد المستحق: ${fmtBal(b)}`;
}
const remindText = (c) => `السلام عليكم ${c.name}، تذكير ودّي من ${shopName()}: رصيدكم المستحق ${fmtBal(balanceOf(c.id))}. نرجو التسديد بأقرب وقت. شكراً لكم 🌹`;

/* ---------- suppliers ---------- */
VIEWS.suppliers = () => `${top('الموزّعون', { right: `<button class="iconbtn" data-act="supNew" aria-label="موزّع جديد" style="background:var(--brand);color:var(--brand-ink);border-color:var(--brand)">${ic('plus')}</button>` })}
  <div class="stack"><p class="small muted">سجّل الموزّعين واربط كل نوع بضاعة بالموزّع الذي تشتري منه. بعدها تطلع قائمة «المطلوب شراؤه» مقسّمة حسب الموزّع.</p>
  <button class="btn primary block" data-act="go" data-v="lowStock">${ic('list', 'sm')} قائمة المطلوب شراؤه</button>
  ${S.suppliers.length ? `<div class="card flush">${S.suppliers.slice().sort((a, b) => a.name.localeCompare(b.name, 'ar')).map((s) => { const n = S.products.filter((p) => p.sup === s.id).length; const low = S.products.filter((p) => p.sup === s.id && isLow(p)).length; return `<button class="row" data-act="supOpen" data-id="${s.id}"><span class="avatar">${esc(initial(s.name))}</span><span class="grow"><b class="trunc" style="display:block">${esc(s.name)}</b><span class="small muted">${n} منتج${s.phone ? ' · ' + esc(s.phone) : ''}</span></span>${low ? pill('warn', low + ' ناقص') : ''}</button>`; }).join('')}</div>` : empty('box', 'لا موزّعين بعد. أضف أول موزّع.')}
  ${S.products.some((p) => !p.sup) && S.suppliers.length ? `<div class="sec">منتجات بلا موزّع: ${S.products.filter((p) => !p.sup).length}</div><button class="btn block" data-act="supAssignNone">ربط المنتجات غير المرتبطة</button>` : ''}</div>`;
VIEWS.supplierDetail = (p) => {
  const s = by('suppliers', p.id); if (!s) return top('موزّع') + empty('box', 'غير موجود');
  const ps = S.products.filter((x) => x.sup === s.id).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  return `${top(s.name, { right: `<button class="iconbtn" data-act="supEdit" data-id="${s.id}" aria-label="تعديل">${ic('edit')}</button>` })}
  <div class="stack">${s.phone || s.note || s.days ? `<div class="card stack-s">${s.phone ? `<span dir="ltr" style="text-align:start">${ic('phone', 'sm')} ${esc(s.phone)}</span>` : ''}${s.days ? `<span class="small">أيام التوريد: ${esc(s.days)}</span>` : ''}${s.note ? `<span class="small muted">${esc(s.note)}</span>` : ''}</div>` : ''}
  <div class="hero"><span class="sub small">المتبقي عليك لهذا الموزّع</span><h1 class="num" style="font-size:26px">${fmtBal(supBalance(s.id)) === '0' ? '0' : fmtBal(supBalance(s.id))}</h1></div>
  <div class="btnrow"><button class="btn primary" data-act="purNew" data-id="${s.id}">${ic('receipt', 'sm')} فاتورة شراء</button><button class="btn good" data-act="supPaySheet" data-id="${s.id}">${ic('wallet', 'sm')} دفعة للموزّع</button></div>
  <div class="btnrow"><button class="btn" data-act="supAssign" data-id="${s.id}">${ic('plus', 'sm')} ربط منتجات</button><button class="btn" data-act="supOrder" data-id="${s.id}">${ic('send', 'sm')} طلب الناقص</button></div>
  ${S.purchases.filter((x) => x.sup === s.id).length ? `<div class="sec">فواتير الشراء</div><div class="card flush">${S.purchases.filter((x) => x.sup === s.id).sort((a, b) => b.ts - a.ts).slice(0, 20).map((x) => `<button class="row" data-act="purOpen" data-id="${x.id}"><span class="avatar">${ic('receipt')}</span><span class="grow"><b style="display:block">${fmtDateS(x.date)} · ${x.lines.length} صنف</b><span class="small muted">${x.due > 0 ? 'متبقي ' + money(x.due, x.cur) : 'مدفوعة'}</span></span><b class="num">${money(x.total, x.cur)}</b></button>`).join('')}</div>` : ''}
  ${S.supPays.filter((x) => x.sup === s.id).length ? `<div class="sec">دفعاتك للموزّع</div><div class="card flush">${S.supPays.filter((x) => x.sup === s.id).sort((a, b) => b.ts - a.ts).slice(0, 15).map((x) => `<button class="row" data-act="supPayOpen" data-id="${x.id}"><span class="avatar good">${ic('check')}</span><span class="grow"><b>${fmtDateS(x.date)} · ${x.method === 'sham' ? 'شام كاش' : 'نقداً'}</b></span><b class="num">${money(x.amt, x.cur)}</b></button>`).join('')}</div>` : ''}
  <div class="sec">البضاعة التي تشتريها منه (${ps.length})</div>
  ${ps.length ? `<div class="card flush">${ps.map(productRow).join('')}</div>` : empty('box', 'لم تربط أي منتج بهذا الموزّع بعد.')}</div>`;
};
function orderText(list, s) { return `${s ? 'طلب بضاعة — ' + shopName() + '\n' + s.name + '\n' : ''}` + list.map((p) => `• ${p.name} (المتوفر ${fmtQ(p.stock)} ${unitLabel(p)})`).join('\n'); }
VIEWS.lowStock = () => {
  const low = S.products.filter(isLow); const groups = {}; for (const p of low) (groups[p.sup || ''] = groups[p.sup || ''] || []).push(p);
  const ids = Object.keys(groups).sort((a, b) => (a === '' ? 1 : b === '' ? -1 : supName(a).localeCompare(supName(b), 'ar')));
  return `${top('المطلوب شراؤه')}<div class="stack">${ids.length ? ids.map((id) => { const s = by('suppliers', id); return `<div class="card stack-s"><div class="between"><b>${s ? '🚚 ' + esc(s.name) : 'بدون موزّع'}</b><span class="small muted">${groups[id].length} صنف</span></div>${groups[id].map((p) => `<div class="between small"><span>${esc(p.name)}</span><span class="muted">المتوفر ${fmtQ(p.stock)} / الحد ${fmtQ(minOf(p))}</span></div>`).join('')}
  <div class="btnrow"><button class="btn sm" data-act="orderCopy" data-id="${id}">${ic('copy', 'sm')} نسخ</button>${s && s.phone ? `<button class="btn sm primary" data-act="supOrder" data-id="${id}">${ic('send', 'sm')} واتساب للموزّع</button>` : ''}</div></div>`; }).join('') : empty('check', 'كل المنتجات فوق حد التنبيه 👌')}${(() => { const so = soonOut(); return so.length ? `<div class="card flush"><div style="padding:14px 16px 4px"><h2>ينفد قريباً حسب سرعة البيع</h2></div>${so.map(({ p, d }) => `<div class="row"><span class="grow"><b class="trunc" style="display:block">${esc(p.name)}</b><span class="small muted">المتوفر ${fmtQ(p.stock)} ${esc(unitLabel(p))}</span></span><span class="small">يكفي حوالي <b class="num">${Math.max(1, Math.round(d))}</b> يوم</span></div>`).join('')}</div>` : ''; })()}</div>`;
};
VIEWS.expiring = () => { const t = today(); const r = S.products.filter((p) => p.exp && p.stock > 0 && diffDays(p.exp, t) <= S.set.expDays).sort((a, b) => (a.exp < b.exp ? -1 : 1)); return `${top('قريب الانتهاء')}<div class="stack">${r.length ? `<div class="card flush">${r.map((p) => `<button class="row" data-act="productOpen" data-id="${p.id}"><span class="avatar ${diffDays(p.exp, t) < 0 ? 'bad' : 'warn'}">${ic('clock')}</span><span class="grow"><b class="trunc" style="display:block">${esc(p.name)}</b><span class="small muted">${fmtDate(p.exp)} · المتوفر ${fmtQ(p.stock)}</span></span>${diffDays(p.exp, t) < 0 ? pill('bad', 'منتهٍ') : pill('warn', 'بعد ' + diffDays(p.exp, t) + ' يوم')}</button>`).join('')}</div>` : empty('check', 'لا شي قريب الانتهاء')}</div>`; };

/* ---------- sales ---------- */
VIEWS.sales = () => {
  const d = V.p.d || today(); const r = S.sales.filter((s) => s.date === d).sort((a, b) => b.ts - a.ts); const live = r.filter((s) => !s.void);
  return `${top('سجل المبيعات')}<div class="stack"><div class="gap"><button class="iconbtn" data-act="salesDay" data-d="-1" aria-label="اليوم السابق">${ic('chev')}</button><input class="in grow" type="date" id="sales-d" value="${d}" data-change="salesDate"><button class="iconbtn" data-act="salesDay" data-d="1" aria-label="اليوم التالي"><span class="mirror">${ic('chev')}</span></button></div>
  <div class="card"><div class="between"><span class="muted">${live.length} فاتورة</span><b class="num">${fmtS(sum(live, (s) => s.total))}</b></div></div>
  ${r.length ? `<div class="card flush">${r.map(saleRow).join('')}</div>` : empty('receipt', 'لا مبيعات في هذا اليوم')}</div>`;
};
function receiptText(s) {
  const c = by('customers', s.cid);
  return `${shopName()}\nفاتورة #${s.no} — ${s.date} ${fmtTime(s.ts)}\n` + s.items.map((i) => `• ${i.name} × ${fmtQ(i.qty)}${i.ul || i.unit ? ' ' + (i.ul || i.unit) : ''} = ${fmtS(Math.round(i.qty * i.price))}`).join('\n') + (s.disc ? `\nخصم: ${fmtS(s.disc)}` : '') + `\nالإجمالي: ${fmtS(s.total)}\n` + s.pays.map((p) => `${p.m === 'cash' ? 'نقداً' : p.m === 'sham' ? 'شام كاش' + (p.payer ? ' (من ' + p.payer + ')' : '') : 'دين' + (c ? ' على ' + c.name : '')}: ${fmtS(p.amt)}`).join('\n') + '\nشكراً لزيارتكم 🌹';
}
function saleSheet(id, fresh) {
  const s = by('sales', id); if (!s) return; const c = by('customers', s.cid);
  const change = s.recv && s.recv > (s.pays.find((p) => p.m === 'cash') || { amt: 0 }).amt ? s.recv - (s.pays.find((p) => p.m === 'cash') || { amt: 0 }).amt : 0;
  sheet(`<div class="grab"></div>${fresh ? `<div class="between" style="margin-bottom:8px"><span class="avatar good">${ic('check')}</span><h2 class="grow" style="margin:0 10px">تم البيع ✔</h2></div>` : `<h2>${s.ret ? 'مردود' : 'فاتورة'} #${s.no} ${s.void ? pill('bad', 'ملغاة') : ''}</h2>`}
  <div class="stack"><div class="card flush">${s.items.map((i) => `<div class="row"><span class="grow"><b class="trunc" style="display:block">${esc(i.name)}</b><span class="small muted">${fmtQ(i.qty)} ${esc(i.ul || i.unit || '')} × ${fmtS(i.price)}</span></span><b class="num">${fmtS(Math.round(i.qty * i.price))}</b></div>`).join('')}</div>
  <div class="card stack-s">${s.disc ? `<div class="between"><span class="muted">خصم</span><b class="num">−${fmtS(s.disc)}</b></div>` : ''}<div class="between"><b>الإجمالي</b><b class="num" style="font-size:20px">${fmtS(s.total)}</b></div>
  ${s.pays.map((p) => `<div class="between small"><span class="muted">${p.m === 'cash' ? 'نقداً' : p.m === 'sham' ? 'شام كاش' + (p.payer ? ' — من ' + esc(p.payer) : '') + (p.ref ? ' · مرجع ' + esc(p.ref) : '') : 'دين' + (c ? ' — ' + esc(c.name) : '')}</span><b class="num">${fmtS(p.amt)}</b></div>`).join('')}
  ${change > 0 ? `<div class="between"><span class="muted">الباقي للزبون</span><b class="num">${fmtS(change)}</b></div>` : ''}
  ${c ? `<div class="between small"><span class="muted">الزبون</span><b>${esc(c.name)}</b></div>` : ''}${s.recv ? `<div class="between small"><span class="muted">المستلم</span><b>${esc(s.recv)}</b></div>` : ''}
  <span class="small muted">${fmtDate(s.date)} ${fmtTime(s.ts)}${s.rate ? ' · سعر الصرف ' + group(s.rate) : ''}</span></div>${thumbsHtml(s.photos)}
  <div class="btnrow"><button class="btn" data-act="rcptShare" data-id="${id}">${ic('send', 'sm')} مشاركة الفاتورة</button><button class="btn" data-act="rcptCopy" data-id="${id}">${ic('copy', 'sm')} نسخ</button></div>
  <div class="btnrow"><button class="btn" data-act="rcptPng" data-id="${id}">صورة PNG</button><button class="btn" data-act="rcptPdf" data-id="${id}">ملف PDF</button></div>
  <button class="btn block" data-act="rcptBt" data-id="${id}">طباعة بلوتوث (تجريبي)</button>
  ${fresh ? `<button class="btn primary block" data-act="closeSheet">بيع جديد</button>` : (s.void ? '' : (s.ret ? '' : `<button class="btn block" data-act="retOpen" data-id="${id}">إرجاع أصناف (مردود بيع)</button>`) + `<button class="btn danger block" data-act="saleVoid" data-id="${id}">إلغاء الفاتورة (إرجاع للمخزون)</button>`)}</div>`);
}

/* ---------- reports ---------- */
function barChart(days) {
  if (!days.length) return ''; const W = 320, H = 130, pad_ = 4; const mx = Math.max(1, ...days.map((d) => d.rev)); const bw = (W - pad_ * 2) / days.length;
  const bars = days.map((d, i) => { const h = Math.round((d.rev / mx) * (H - 26)); const g = Math.max(0, Math.round((d.gross / mx) * (H - 26))); const x = pad_ + i * bw; return `<rect x="${x + bw * 0.12}" y="${H - 16 - h}" width="${bw * 0.76}" height="${h}" rx="2" fill="var(--brand)" opacity=".35"/><rect x="${x + bw * 0.12}" y="${H - 16 - g}" width="${bw * 0.76}" height="${g}" rx="2" fill="var(--good)"/>`; }).join('');
  const lab = days.length <= 10 ? days.map((d, i) => `<text x="${pad_ + i * bw + bw / 2}" y="${H - 3}" font-size="9" text-anchor="middle" fill="var(--muted)">${Number(d.d.slice(8))}</text>`).join('') : `<text x="${pad_}" y="${H - 3}" font-size="9" fill="var(--muted)">${Number(days[0].d.slice(8))}</text><text x="${W - pad_}" y="${H - 3}" font-size="9" text-anchor="end" fill="var(--muted)">${Number(days[days.length - 1].d.slice(8))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم المبيعات والربح اليومي"><line x1="0" x2="${W}" y1="${H - 16}" y2="${H - 16}" stroke="var(--line)"/>${bars}${lab}</svg><div class="legend"><span><i style="background:var(--brand);opacity:.4"></i>المبيعات</span><span><i style="background:var(--good)"></i>الربح الإجمالي</span></div>`;
}
VIEWS.reports = () => {
  const per = V.p.per || 'day'; const [f, t] = periodRange(per, V.p.c1, V.p.c2); const R = report(f, t);
  const PER = [['day', 'اليوم'], ['yday', 'أمس'], ['week', 'الأسبوع'], ['month', 'الشهر'], ['pmonth', 'الشهر الماضي'], ['custom', 'مخصص']];
  const tp = R.top.slice().sort((a, b) => b.profit - a.profit).slice(0, 8); const sv = stockValue();
  return `${top('التقارير')}<div class="stack"><div class="chips">${PER.map(([k, l]) => `<button class="chip ${per === k ? 'on' : ''}" data-act="repPer" data-k="${k}">${l}</button>`).join('')}</div>
  ${per === 'custom' ? `<div class="two">${fld('rp-a', 'من', f, 'type="date" data-change="repCustom"')}${fld('rp-b', 'إلى', t, 'type="date" data-change="repCustom"')}</div>` : ''}
  <div class="hero"><span class="sub small">صافي الربح (بعد المصروفات والرواتب)</span><h1 class="num" style="font-size:28px;color:${R.net < 0 ? '#FFB4AB' : '#fff'}">${fmtS(R.net)}</h1><span class="sub small num">≈ ${fmtU(R.netU)} بسعر صرف كل يوم · ${R.n} فاتورة</span></div>

};
const monthNav = (m, act) => `<div class="gap"><button class="iconbtn" data-act="${act}" data-d="-1" aria-label="الشهر السابق">${ic('chev')}</button><b class="grow" style="text-align:center">${monthName(m)}</b><button class="iconbtn" data-act="${act}" data-d="1" aria-label="الشهر التالي"><span class="mirror">${ic('chev')}</span></button></div>`;

/* ---------- sham cash log ---------- */
function shamEntries(m) {
  const out = [];
  for (const s of liveSales()) for (const p of s.pays) if (p.m === 'sham' && monthOf(s.date) === m) out.push({ dir: 'in', ts: s.ts, date: s.date, amt: p.amt, who: p.payer, ref: p.ref, what: 'فاتورة #' + s.no });
  for (const e of S.ledger) if (e.type === 'pay' && e.method === 'sham' && monthOf(e.date) === m) { const c = by('customers', e.cid); out.push({ dir: 'in', ts: e.ts, date: e.date, amt: e.cur === 'USD' ? e.amt * (rateOn(e.date) || 0) : e.amt, who: e.payer || (c && c.name), ref: e.ref, what: 'تسديد دين' + (c ? ' — ' + c.name : ''), usd: e.cur === 'USD' ? e.amt : 0 }); }
  for (const e of S.expenses) if (e.method === 'sham' && monthOf(e.date) === m) out.push({ dir: 'out', ts: e.ts, date: e.date, amt: e.amt, who: e.payer, ref: e.ref, what: e.cat + (e.note ? ' — ' + e.note : '') });
  return out.sort((a, b) => b.ts - a.ts);
}
VIEWS.shamLog = () => {
  const m = V.p.m || monthOf(today()); const r = shamEntries(m); const inn = sum(r.filter((x) => x.dir === 'in'), (x) => x.amt), out = sum(r.filter((x) => x.dir === 'out'), (x) => x.amt);
  return `${top('سجل شام كاش')}<div class="stack"><p class="small muted">هذا سجل لما كتبته أنت فقط (لا اتصال مع تطبيق شام كاش). استخدمه للمطابقة مع كشف تطبيقهم.</p>${monthNav(m, 'shamMonth')}
  <div class="kpis" style="grid-template-columns:1fr 1fr">${kpi('وارد', fmtS(inn), 'good')}${kpi('صادر', fmtS(out))}</div>
  ${r.length ? `<div class="card flush">${r.map((x) => `<div class="row"><span class="avatar ${x.dir === 'in' ? 'good' : 'bad'}">${ic(x.dir === 'in' ? 'download' : 'upload')}</span><span class="grow"><b class="trunc" style="display:block">${x.dir === 'in' ? 'من' : 'إلى'} ${esc(x.who || 'غير مذكور')}</b><span class="small muted trunc" style="display:block">${fmtDateS(x.date)} ${fmtTime(x.ts)} · ${esc(x.what)}${x.ref ? ' · مرجع ' + esc(x.ref) : ''}</span></span><b class="num">${fmtS(x.amt)}</b></div>`).join('')}</div><button class="btn block" data-act="shamCsv">${ic('download', 'sm')} تصدير CSV</button>` : empty('phoneapp', 'لا حركات شام كاش هذا الشهر')}</div>`;
};

function receiptCanvas(s, W = 384) {

  const heights = L.map((l) => (l.hr ? 14 : Math.round((l.sz || 20) * 1.5))); cv.height = heights.reduce((a, b) => a + b, PAD * 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, cv.height); ctx.fillStyle = '#000'; ctx.direction = 'rtl'; ctx.textBaseline = 'middle';
  L.forEach((l, k) => {
    const mid = h + heights[k] / 2;
    if (l.hr) { ctx.fillRect(PAD, mid, W - PAD * 2, 1); } else { ctx.font = font(l);
      if (l.c) { ctx.textAlign = 'center'; ctx.fillText(l.t, W / 2, mid); } else if (l.t) { ctx.textAlign = 'right'; ctx.fillText(l.t, W - PAD, mid, W - PAD * 2); } else { ctx.textAlign = 'right'; ctx.fillText(l.r, W - PAD, mid, W * 0.6); ctx.textAlign = 'left'; ctx.fillText(l.l, PAD, mid); } }

/* ESC/POS raster print over Web Bluetooth. Works only where the browser exposes Web Bluetooth (Chrome on Android); inside the APK WebView it usually does not. */
let BT = null;
async function rcptBt(id) {
  const s = by('sales', id); if (!s) return;
  if (!navigator.bluetooth) { toast('الطباعة المباشرة غير مدعومة هنا. افتح التطبيق من Chrome، أو صدّر الفاتورة صورة/PDF واطبعها من تطبيق الطابعة.'); return; }
  try {
    if (!BT || !BT.dev.gatt.connected) {
      const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '0000ff00-0000-1000-8000-00805f9b34fb'] });
      const srv = await dev.gatt.connect(); let ch = null; for (const sv of await srv.getPrimaryServices()) { for (const c of await sv.getCharacteristics()) { if (c.properties.write || c.properties.writeWithoutResponse) { ch = c; break; } } if (ch) break; }
      if (!ch) throw new Error('لم أجد قناة طباعة في هذا الجهاز'); BT = { dev, ch };
    }
    const cv = receiptCanvas(s, 384); const ctx = cv.getContext('2d'); const img = ctx.getImageData(0, 0, cv.width, cv.height).data; const wb = cv.width / 8; const rows = cv.height;
    const data = new Uint8Array(wb * rows); for (let y = 0; y < rows; y++) for (let x = 0; x < cv.width; x++) { const i = (y * cv.width + x) * 4; const lum = img[i] * 0.3 + img[i + 1] * 0.59 + img[i + 2] * 0.11; if (lum < 140) data[y * wb + (x >> 3)] |= 0x80 >> (x & 7); }
    const hdr = new Uint8Array([0x1b, 0x40, 0x1d, 0x76, 0x30, 0, wb & 255, wb >> 8, rows & 255, rows >> 8]); const tail = new Uint8Array([0x1b, 0x64, 4, 0x1d, 0x56, 0x42, 0]);
    const all = new Uint8Array(hdr.length + data.length + tail.length); all.set(hdr, 0); all.set(data, hdr.length); all.set(tail, hdr.length + data.length);
    for (let o = 0; o < all.length; o += 100) { const part = all.slice(o, o + 100); if (BT.ch.properties.writeWithoutResponse) await BT.ch.writeValueWithoutResponse(part); else await BT.ch.writeValue(part); await new Promise((r) => setTimeout(r, 20)); }
    toast('أُرسلت الفاتورة للطابعة');
  } catch (e) { BT = null; if (e && e.name === 'NotFoundError') return; toast('تعذّرت الطباعة: ' + ((e && e.message) || e)); }
}

/* how fast does a product sell (units/day over the last N days) and how long will stock last */
function sellSpeed(p, days = 30) {
  const from = addDays(today(), -days); let q = 0;
  for (const s of liveSales()) { if (s.date < from) continue; for (const i of s.items) if (i.pid === p.id) q += i.qty * (i.f || 1); }
  return q / days;
}

  const out = []; for (const p of S.products) { if (p.track === false || !(p.stock > 0) || isLow(p)) continue; const v = sellSpeed(p); if (v > 0) { const d = p.stock / v; if (d <= maxDays) out.push({ p, d }); } }
  return out.sort((a, b) => a.d - b.d);
}

async function takeSnapshot() {
  if (!DB) return; const t = today(); const keys = await idbReq(DB.transaction('meta').objectStore('meta').getAllKeys()); const sn = keys.filter((k) => String(k).startsWith('snap:')).sort();

}

const idOf = (el) => el.dataset.id;

const findOrAddCustomer = (name, phone) => { const n = nrm(name); let c = S.customers.find((x) => nrm(x.name) === n); if (!c) c = put('customers', { id: uid(), name: name.trim(), phone: phone || '', note: '', created: today() }); return c; };
const findOrAddSupplier = (name) => { const n = nrm(name); let s = S.suppliers.find((x) => nrm(x.name) === n); if (!s) s = put('suppliers', { id: uid(), name: name.trim(), phone: '', days: '', note: '' }); return s; };
const curTok = (t, dflt) => { const x = String(t || '').trim().toLowerCase(); if (!x) return dflt; if (/usd|\$|دولار|دولا/.test(x)) return 'USD'; if (/syp|ل\.?س|ليرة|lira|sp/.test(x)) return 'SYP'; return dflt; };
let PEND_RESTORE = null; let PEND_IMP = null;
function ensureCat(name) { if (name && !catOf(name)) { S.set.cats.push({ n: name }); saveSet(); } }
function upsertProduct(o) {
  let p = (o.barcode && findBarcode(o.barcode)) || S.products.find((x) => nrm(x.name) === nrm(o.name)); const isNew = !p;
  if (o.cat) ensureCat(o.cat);
  const cat = o.cat || (p && p.cat) || ''; const cur = isLocalCat(cat) ? 'SYP' : o.cur || (p && p.cur) || 'USD';
  const rec = Object.assign(p || { id: uid(), created: Date.now(), stock: 0, track: true, unit: 'قطعة' }, { name: o.name, cat, cur, price: o.price, updated: Date.now() });
  if (o.barcode) rec.barcode = o.barcode; if (o.cost != null && !isNaN(o.cost)) rec.cost = o.cost; if (o.sup) rec.sup = o.sup; if (o.unit) rec.unit = o.unit;
  put('products', rec);
  if (o.stock != null && !isNaN(o.stock)) { const d = o.stock - (isNew ? 0 : rec.stock); if (isNew) { rec.stock = 0; } if (d !== 0) stockMove(rec, d, isNew ? 'init' : 'adjust', isNew ? 'رصيد افتتاحي' : 'استيراد'); }
  return { rec, isNew };
}

/* ---------- import parsing ---------- */
function impParse(run) {
  const mode = V.p.mode || 'products'; const rows = parseDelim($('#imp-text').value); const prev = $('#imp-prev'); const errEl = document.querySelector('.formerr'); errEl.textContent = '';
  if (!rows.length) { errEl.textContent = 'الصق القائمة أولاً.'; return; }
  const hdr = /^(الاسم|اسم|name)/i.test(rows[0][0] || ''); const data = hdr ? rows.slice(1) : rows; const ok = [], bad = [];
  data.forEach((r, i) => {
    if (mode === 'products') { const name = (r[0] || '').trim(), price = toNum(r[2]); if (!name || !(price >= 0)) { bad.push(i + 1 + (hdr ? 1 : 0)); return; } ok.push({ name, barcode: (r[1] || '').replace(/\D/g, ''), price, cur: curTok(r[3], null), cost: toNum(r[4]), stock: toNum(r[5]), cat: (r[6] || '').trim(), sup: (r[7] || '').trim(), unit: (r[8] || '').trim() }); }
    else { const name = (r[0] || '').trim(), amt = toNum(r[2]); if (!name || !(amt > 0)) { bad.push(i + 1 + (hdr ? 1 : 0)); return; } const d = (r[4] || '').trim(); ok.push({ name, phone: (r[1] || '').trim(), amt, cur: curTok(r[3], 'SYP'), date: validDate(d) ? d : today() }); }
  });
  prev.innerHTML = `<b>${ok.length}</b> سطر صالح${bad.length ? ` · <span style="color:var(--bad)">${bad.length} سطر مرفوض (رقم ${bad.slice(0, 8).join('، ')}${bad.length > 8 ? '…' : ''}): الاسم أو السعر/المبلغ ناقص</span>` : ''}${ok.slice(0, 3).map((x) => `<div class="muted">• ${esc(x.name)} — ${x.price != null ? x.price : x.amt}</div>`).join('')}`;
  if (!run) return; if (!ok.length) { errEl.textContent = 'لا أسطر صالحة للاستيراد.'; return; }
  let added = 0, upd = 0;
  if (mode === 'products') for (const o of ok) { if (o.sup) o.sup = findOrAddSupplier(o.sup).id; const { isNew } = upsertProduct(o); if (isNew) added++; else upd++; }
  else for (const o of ok) { const c = findOrAddCustomer(o.name, o.phone); addLedger({ cid: c.id, type: 'debt', cur: o.cur, amt: o.cur === 'USD' ? r2(o.amt) : Math.round(o.amt), date: o.date, note: 'رصيد سابق (استيراد)', old: o.date < today() }); added++; }
  $('#imp-text').value = ''; prev.innerHTML = ''; render(false); toast(mode === 'products' ? `تم: ${added} جديد، ${upd} محدَّث` : `استُوردت ${added} ديون`);
}

    sheet('<div class="grab"></div><h2>قراءة الفاتورة</h2><div class="stack"><p>جارٍ قراءة الصورة على جهازك… قد تأخذ نصف دقيقة. لا تخرج من الشاشة.</p><p class="num" id="ocr-prog">…</p></div>');
    let text = '', err = '';
    try { const blobs = []; for (const id of PUR.photos) { const f = PUR.raw && PUR.raw[id]; if (f) blobs.push(f); else { const r = await photoGet(id); if (r && r.blob) blobs.push(r.blob); } } text = await ocrRun(blobs); } catch (e) { err = 'تعذّرت القراءة التلقائية: ' + (e && e.message ? e.message : e) + '. تقدر تكتب/تلصق نص الفاتورة تحت.'; }

    if (!lines.length) { err.textContent = 'ما في أصناف محددة.'; return; }

document.addEventListener('input', (e) => {
  const d = e.target.dataset; if (!d || !d.ocr || !OCRR || d.ocr === 'mode') return; const i = +d.i, r = OCRR.rows[i]; if (!r) return;
  if (d.ocr === 'name') { r.name = e.target.value; return; } if (d.ocr === 'qty' || d.ocr === 'price') r[d.ocr] = e.target.value; else if (d.ocr === 'per') { r.per = e.target.value; r.perEdit = true; } ocrPrev(i);
});
document.addEventListener('change', (e) => {

  if (d.ocr === 'mode') { OCRR.mode = e.target.value; ocrSheet(''); return; } const i = +d.i, r = OCRR.rows[i]; if (!r) return;
  if (d.ocr === 'inc') { r.inc = e.target.checked; return; }

function pfMgSync() { const el = document.getElementById('pf-mg'); if (!el || document.activeElement === el) return; const pr = toNum(val('pf-price')), co = toNum(val('pf-cost')); el.value = pr > 0 && co > 0 ? String(Math.round((pr / co - 1) * 1000) / 10) : ''; }
document.addEventListener('input', (e) => {

  const cur = val('pf-cur') || 'SYP';
  if (id === 'pf-mg') { PFMG.lock = true; const m = toNum(e.target.value), co = toNum(val('pf-cost')); if (m >= 0 && co > 0) { document.getElementById('pf-price').value = String(mgRound(co * (1 + m / 100), cur)); pfCalc(); } }
  else if (id === 'pf-cost') { if (PFMG.lock) { const m = toNum(val('pf-mg')), co = toNum(e.target.value); if (m >= 0 && co > 0) { document.getElementById('pf-price').value = String(mgRound(co * (1 + m / 100), cur)); pfCalc(); } } else pfMgSync(); }
  else { PFMG.lock = false; pfMgSync(); }
});

/* ================= returns (sales & purchases) + warehouse report ================= */
const saleRetQty = (sid, ix) => sum(S.sales.filter((r) => !r.void && r.ret === sid), (r) => -((r.items.find((i) => i.ri === ix) || { qty: 0 }).qty));
function makeSaleReturn(sid, qtys, method) {
  const o = by('sales', sid); if (!o) return null; const items = [];
  o.items.forEach((i, ix) => { const q = qtys[ix]; if (q > 0) items.push({ pid: i.pid || null, name: i.name, qty: -q, price: i.price, cost: i.cost || 0, cur: i.cur || 'SYP', unit: i.unit || '', ul: i.ul || '', f: i.f || 1, ri: ix }); });
  if (!items.length) return null;
  const rate = curRate(); const sub = Math.round(sum(items, (i) => i.qty * i.price)); const disc = o.sub ? Math.round(o.disc * sub / o.sub) : 0; const total = sub - disc;
  const rec = { id: uid(), no: ++S.set.seq, ts: Date.now(), date: today(), items, sub, disc, total, pays: [{ m: method, amt: total }], cid: o.cid || '', rate, debtCur: o.debtCur || 'SYP', note: 'مردود فاتورة #' + o.no, recv: '', photos: [], got: 0, void: 0, ret: sid };
  saveSet(); put('sales', rec);
  for (const i of items) { if (i.pid) { const p = by('products', i.pid); if (p && p.track !== false) stockMove(p, -i.qty * i.f, 'ret', 'مردود فاتورة #' + o.no, rec.id); } }
  if (method === 'debt' && rec.cid) { const usd = rec.debtCur === 'USD' && rate > 0; addLedger({ cid: rec.cid, type: 'pay', cur: usd ? 'USD' : 'SYP', amt: usd ? r2(-total / rate) : -total, method: 'return', saleId: rec.id, note: 'مردود فاتورة #' + o.no, rate }); }
  return rec;
}
function makePurchaseReturn(id, qtys, method) {
  const r = by('purchases', id); if (!r) return false; let credit = 0;
  r.lines.forEach((l, ix) => { const q = qtys[ix]; if (q > 0) { const p = by('products', l.pid); if (p) stockMove(p, -q, 'ret', 'مردود شراء', id); l.retU = (l.retU || 0) + q; credit += q * l.unitCost; } });
  credit = r2(credit); if (!(credit > 0)) return false; put('purchases', r);
  if (method === 'credit') put('supPays', { id: uid(), ts: Date.now(), date: today(), sup: r.sup, amt: credit, cur: r.cur, method: 'return', payer: '', ref: '', note: 'مردود شراء', ret: id });
  else put('deposits', { id: uid(), ts: Date.now(), date: today(), amt: toSyp(credit, r.cur), note: 'مردود شراء', ret: id });
  return true;
}
function stockComposite(p) {
  const b = Number(p.boxQ) || 0, c = Number(p.pack) || 0; if (isWeighed(p) || !(b > 1 || c > 1)) return fmtQ(p.stock) + ' ' + unitLabel(p);
  let rem = Math.round(Math.abs(p.stock) * 1000) / 1000; const parts = []; let ct = 0, bx = 0;
  if (c > 1) { ct = Math.floor(rem / c); rem -= ct * c; parts.push(ct + ' طرد'); } if (b > 1) { bx = Math.floor(rem / b); rem -= bx * b; parts.push(bx + ' علبة'); }
  parts.push(fmtQ(rem) + ' ' + unitLabel(p)); return (p.stock < 0 ? '-' : '') + parts.join(' · ');
}
function wlistHtml() {
  const q = nrm(V.p.q || ''); const rate = curRate();
  const r = S.products.filter((p) => p.track !== false && (!q || nrm(p.name).includes(q) || String(p.barcode || '').includes(q))).sort((a, b) => a.name.localeCompare(b.name, 'ar')).slice(0, 300);

}
